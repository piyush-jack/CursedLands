<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Texture viewer</title>
<style>
  html,body{margin:0;background:#2b2b2b;color:#ddd;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .row{display:flex;flex-wrap:wrap;gap:10px;padding:10px;align-items:flex-end}
  .c{image-rendering:pixelated;display:block}
  figure{margin:0;text-align:center}
</style></head>
<body>
<div class="row" id="atlas"></div>
<div class="row" id="icons"></div>
<div class="row" id="sprites"></div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import { getAtlas, TILE_NAMES, BLOCK_DEFS, blockIcon, itemSprite } from './textures.js';
const a = getAtlas().canvas;
const big = document.createElement('canvas'); big.width = 128 * 4; big.height = 128 * 4;
const g = big.getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = '#ff00ff'; g.fillRect(0, 0, big.width, big.height); g.drawImage(a, 0, 0, big.width, big.height);
big.className = 'c'; document.getElementById('atlas').appendChild(big);
const names = document.createElement('div'); names.textContent = TILE_NAMES.map((n, i) => i + ':' + n).join('  '); names.style.maxWidth = '500px'; document.getElementById('atlas').appendChild(names);
for (const id of Object.keys(BLOCK_DEFS)) {
  const f = document.createElement('figure'); const im = new Image(); im.src = blockIcon(+id); im.width = 64; im.className = 'c';
  f.appendChild(im); f.appendChild(document.createElement('div')).textContent = BLOCK_DEFS[id].name; document.getElementById('icons').appendChild(f);
}
const S = (kind, opt, label) => {
  const f = document.createElement('figure'); const c = itemSprite(kind, opt); const d = document.createElement('canvas'); d.width = d.height = 128; d.className = 'c';
  const x = d.getContext('2d'); x.imageSmoothingEnabled = false; x.fillStyle = '#555'; x.fillRect(0, 0, 128, 128); x.drawImage(c, 0, 0, 128, 128);
  f.appendChild(d); f.appendChild(document.createElement('div')).textContent = label; document.getElementById('sprites').appendChild(f);
};
S('sword', 0, 'wood'); S('sword', 1, 'iron'); S('sword', 2, 'diamond');
S('bow', 0, 'bow'); S('bow', 1, 'pull1'); S('bow', 2, 'pull2'); S('bow', 3, 'pull3');
S('arrow', 0xbbbbbb, 'arrow');
window.DONE = true;
</script></body></html>
